<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily AI Posts - Admin</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080b12;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:600px;
    margin:30px auto;
    padding:15px;
}

.box{
    background:#111827;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
}

h1,h2{
    text-align:center;
}

input,
textarea{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:10px;
    background:#263244;
    color:white;
    font-size:16px;
}

textarea{
    min-height:150px;
    resize:vertical;
}

button{
    width:100%;
    padding:14px;
    margin-top:14px;
    border:0;
    border-radius:10px;
    background:#4285f4;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.logout{
    background:#444;
}

.delete{
    background:#d93025;
}

.message{
    text-align:center;
    margin-top:14px;
    line-height:1.5;
}

.preview{
    width:100%;
    max-height:300px;
    object-fit:contain;
    margin-top:15px;
    border-radius:12px;
    display:none;
}

.admin-post{
    background:#080b12;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
}

.admin-post img{
    width:100%;
    max-height:250px;
    object-fit:cover;
    border-radius:10px;
    margin-top:10px;
}

#adminPanel{
    display:none;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div class="box" id="loginBox">

<h1>🔐 Admin Login</h1>

<input
    type="email"
    id="email"
    placeholder="Email"
>

<input
    type="password"
    id="password"
    placeholder="Password"
>

<button onclick="login()">
    Login
</button>

<div class="message" id="loginMessage"></div>

</div>


<!-- ADMIN -->

<div class="box" id="adminPanel">

<h1>⚙️ Admin Panel</h1>

<p style="text-align:center;">
    ✅ Login successful
</p>

<h2>➕ नया Post</h2>

<input
    type="text"
    id="postTitle"
    placeholder="Post Title"
>

<input
    type="file"
    id="postImage"
    accept="image/*"
    onchange="previewImage(event)"
>

<img
    id="imagePreview"
    class="preview"
    alt="Preview"
>

<textarea
    id="postPrompt"
    placeholder="यहाँ Prompt लिखें..."
></textarea>

<button onclick="addPost()" id="addButton">
    ➕ Add Post
</button>

<div class="message" id="postMessage"></div>

</div>


<!-- POSTS -->

<div class="box" id="postsBox">

<h2>📝 My Posts</h2>

<div id="adminPosts">
    ⏳ Posts load हो रहे हैं...
</div>

</div>


<div class="box" id="logoutBox" style="display:none;">

<button class="logout" onclick="logout()">
    Logout
</button>

</div>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {

    apiKey: "AIzaSyD5Fr_04TVEj5CqEiisM_-ThMQEJ9R1LM4",

    authDomain: "daily-ai-posts.firebaseapp.com",

    projectId: "daily-ai-posts",

    storageBucket: "daily-ai-posts.firebasestorage.app",

    messagingSenderId: "223242023213",

    appId: "1:223242023213:web:e8e67fd7e587fe763323a4",

    measurementId: "G-7K1WFGR67Y"

};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();


/* CLOUDINARY */

const CLOUD_NAME = "akgmcts8";

const UPLOAD_PRESET = "daily_ai_posts";


/* LOGIN */

function login(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if(!email || !password){

        document.getElementById("loginMessage").innerText =
            "⚠️ Email और Password डालो।";

        return;
    }


    auth.signInWithEmailAndPassword(email,password)

    .then(function(){

        document.getElementById("loginBox").style.display =
            "none";

        document.getElementById("adminPanel").style.display =
            "block";

        document.getElementById("postsBox").style.display =
            "block";

        document.getElementById("logoutBox").style.display =
            "block";

        loadPosts();

    })

    .catch(function(error){

        document.getElementById("loginMessage").innerText =
            "❌ Login नहीं हुआ।";

        console.log(error);

    });

}


/* IMAGE PREVIEW */

function previewImage(event){

    const file =
        event.target.files[0];

    const preview =
        document.getElementById("imagePreview");


    if(!file){

        preview.style.display = "none";

        return;
    }


    const reader =
        new FileReader();


    reader.onload = function(e){

        preview.src = e.target.result;

        preview.style.display = "block";

    };


    reader.readAsDataURL(file);

}


/* ADD POST */

async function addPost(){

    const title =
        document.getElementById("postTitle").value.trim();

    const prompt =
        document.getElementById("postPrompt").value.trim();

    const file =
        document.getElementById("postImage").files[0];

    const message =
        document.getElementById("postMessage");

    const button =
        document.getElementById("addButton");


    if(!title || !prompt || !file){

        message.innerText =
            "⚠️ Title, Photo और Prompt तीनों जरूरी हैं।";

        return;
    }


    button.disabled = true;

    button.innerText =
        "⏳ Photo upload हो रही है...";


    try{

        /* CLOUDINARY UPLOAD */

        const formData =
            new FormData();

        formData.append(
            "file",
            file
        );

        formData.append(
            "upload_preset",
            UPLOAD_PRESET
        );


        const response =
            await fetch(
                `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
                {
                    method:"POST",
                    body:formData
                }
            );


        const result =
            await response.json();


        if(!response.ok){

            throw new Error(
                result.error?.message ||
                "Cloudinary upload failed"
            );

        }


        const imageURL =
            result.secure_url;


        button.innerText =
            "⏳ Post save हो रहा है...";


        /* FIRESTORE */

        await db.collection("Posts").add({

            title:title,

            image:imageURL,

            prompt:prompt,

            createdAt:
                firebase.firestore.FieldValue.serverTimestamp()

        });


        message.innerText =
            "✅ Post successfully add हो गया!";


        document.getElementById("postTitle").value = "";

        document.getElementById("postPrompt").value = "";

        document.getElementById("postImage").value = "";

        document.getElementById("imagePreview").style.display =
            "none";


        loadPosts();

    }

    catch(error){

        console.error(error);

        message.innerText =
            "❌ Post add नहीं हुआ: " +
            error.message;

    }


    button.disabled = false;

    button.innerText =
        "➕ Add Post";

}


/* LOAD POSTS */

function loadPosts(){

    db.collection("Posts")
    .orderBy("createdAt","desc")
    .get()

    .then(function(snapshot){

        const container =
            document.getElementById("adminPosts");

        container.innerHTML = "";


        if(snapshot.empty){

            container.innerHTML =
                "📭 अभी कोई Post नहीं है।";

            return;
        }


        snapshot.forEach(function(doc){

            const data =
                doc.data();


            const post =
                document.createElement("div");

            post.className =
                "admin-post";


            post.innerHTML = `

                <strong>
                    ${escapeHTML(data.title || "Untitled")}
                </strong>

                ${
                    data.image
                    ?
                    `<img src="${escapeHTML(data.image)}">`
                    :
                    ""
                }

                <p>
                    ${escapeHTML(data.prompt || "")}
                </p>

                <button
                    class="delete"
                    onclick="deletePost('${doc.id}')">
                    🗑️ Delete Post
                </button>

            `;


            container.appendChild(post);

        });

    })

    .catch(function(error){

        console.error(error);

        document.getElementById("adminPosts").innerText =
            "❌ Posts load नहीं हुए।";

    });

}


/* DELETE POST */

function deletePost(postId){

    const confirmDelete =
        confirm(
            "क्या आप इस Post को delete करना चाहते हैं?"
        );


    if(!confirmDelete){

        return;
    }


    db.collection("Posts")
    .doc(postId)
    .delete()

    .then(function(){

        alert("✅ Post delete हो गया!");

        loadPosts();

    })

    .catch(function(error){

        console.error(error);

        alert(
            "❌ Post delete नहीं हुआ।"
        );

    });

}


/* SAFE TEXT */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* LOGOUT */

function logout(){

    auth.signOut();

    document.getElementById("loginBox").style.display =
        "block";

    document.getElementById("adminPanel").style.display =
        "none";

    document.getElementById("postsBox").style.display =
        "none";

    document.getElementById("logoutBox").style.display =
        "none";

}

</script>

</body>
</html>
